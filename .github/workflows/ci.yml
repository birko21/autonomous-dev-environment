name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required governance files
        shell: bash
        run: |
          set -e

          required_files=(
            "AGENTS.md"
            "DEFINITION_OF_DONE.md"
            "SECURITY.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          echo "Required governance files are present."

      - name: Check for committed environment files
        shell: bash
        run: |
          set -e

          forbidden_pattern='(^|/)\.env(\.local|\.production|\.development)?$|(^|/).+\.(pem|key|p12|pfx)$'

          if git ls-files | grep -E "$forbidden_pattern"; then
            echo "Forbidden environment or private-key file detected in the repository."
            exit 1
          fi

          if git grep -nI -E -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'; then
            echo "Private-key material detected in tracked file contents."
            exit 1
          fi

          echo "No forbidden environment or private-key material detected."

      - name: Detect project type
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "Node/TypeScript project detected."
          else
            echo "No application project detected yet. Governance-only CI pass."
          fi

      - name: Install Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint

      - name: Type check
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run typecheck

      - name: Test
        if: ${{ hashFiles('package.json') != '' }}
        run: npm test

      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build
